name: Build AURA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Capacitor 7 דורש JDK 21 (לפני כן היה 17).
      # ו-keytool, שמגיע עם ה-JDK, משמש אותנו כדי לאמת את ה-keystore.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # 🤖 **58ל-פד — תוסף התשלומים של גוגל** ✓✓ — **"מאמץ סביר" ולא חובה** ✗✓.
      #    **למה ככה:** לתוסף יש סיכון התקנה ✗ (גרסה, תאימות), ואסור שזה **ישבור
      #    את הבנייה של ה-APK/AAB** ✗✗ — הרי ה-AAB הוא מה שפותח את 14 הימים ✓✓.
      #    ⇒ `--no-save` (לא נוגע ב-package.json ✓) + `continue-on-error` ✓
      #    ⇒ **אם הוא מותקן — הבילינג עובד** ✓; **אם לא — האפליקציה נבנית כרגיל**
      #    וחוזרת למסלול ביט/Upay ✓✓ (הקוד באתר יודע לזהות את שניהם ✓).
      #    והלוג של הצעד הזה **יאומר בדיוק** מה קרה ✓ (זה מה שנבדוק אחרי הבנייה ✓).
      - name: 🤖 Billing plugin (best effort - the app degrades gracefully without it)
        continue-on-error: true
        run: |
          npm install cordova-plugin-purchase --no-save
          echo "--- what we got ---"
          if npm ls cordova-plugin-purchase 2>/dev/null | grep -q cordova-plugin-purchase; then
            echo "BILLING PLUGIN: INSTALLED ✓ (Google Play billing will be active in the APK)"
          else
            echo "BILLING PLUGIN: NOT installed ✗ — the app stays on Bit/Upay (safe fallback, nothing breaks)"
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon
        run: npx capacitor-assets generate --android || echo "Icon generation skipped"
        continue-on-error: true

      - name: Sync web assets to Android
        run: npx cap sync android

      # הרשאות מצלמה ומיקרופון. הלוגיקה בקובץ scripts/patch-android.sh
      # (קובץ אמיתי עדיף על קוד בתוך YAML - אין מלכודות הזחה).
      # חייב לרוץ אחרי cap add android וגם אחרי cap sync android.
      - name: Patch camera + microphone permissions
        run: bash scripts/patch-android.sh

      # 🔊 צליל ההתראה 'aura_ping'. שם הקובץ חייב להיות lowercase
      # עם קווים תחתונים בלבד — זה אילוץ של אנדרואיד.
      # ההפניה בדשבורד של OneSignal נעשית *בלי* הסיומת: aura_ping
      - name: Add notification sound (aura_ping)
        run: |
          set -e
          SRC=""
          for c in sounds/aura_ping.wav aura_ping.wav; do
            if [ -f "$c" ]; then SRC="$c"; break; fi
          done
          if [ -z "$SRC" ]; then echo "ERROR: aura_ping.wav not found in the repo"; exit 1; fi
          echo "sound source: $SRC"
          mkdir -p android/app/src/main/res/raw
          cp "$SRC" android/app/src/main/res/raw/aura_ping.wav
          ls -l android/app/src/main/res/raw/

      # 🔔 אייקון ההתראה. שניים, כי אלו שני דברים שונים באנדרואיד:
      #    • ic_stat_onesignal_default      — האייקון הקטן בשורת הסטטוס.
      #      אנדרואיד דורשת ממנו **מונוכרום לבן עם שקיפות** והיא צובעת אותו בעצמה.
      #    • ic_onesignal_large_icon_default — האייקון הצבעוני בכרטיס ההתראה.
      #    שמות הקבצים קבועים ע"י OneSignal — לא לשנות.
      - name: Add notification icons
        run: |
          set -e
          if [ ! -d android-res ]; then echo "ERROR: android-res/ not found in the repo"; exit 1; fi
          found=0
          for d in android-res/drawable-*; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            mkdir -p "android/app/src/main/res/$name"
            cp -v "$d"/*.png "android/app/src/main/res/$name/"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then echo "ERROR: no drawable-* folders inside android-res/"; exit 1; fi
          echo "--- notification icons in place ---"
          find android/app/src/main/res -name 'ic_*onesignal*' -o -name 'ic_stat_*' | sort

      # 🔐 מפתח החתימה יושב ב-GitHub Secrets — הוא **לא** נמצא בגיט ובשום קובץ.
      #    כאן הוא נכתב לקובץ זמני שנמחק עם סוף הריצה.
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then echo "ERROR: the secret AURA_KEYSTORE_BASE64 is empty"; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "ERROR: the secret AURA_KEYSTORE_PASSWORD is empty"; exit 1; fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aura-release.p12"
          echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/aura-release.p12")"
          # 🔑 מאתרים את ה-alias **אוטומטית** — כדי שלא ניפול על הבדל בשמות
          #    בין הכלים השונים שמייצרים PKCS12. השלב הזה גם מוכיח מראש
          #    שהסיסמה נכונה, ונכשל בבירור אם לא.
          ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/aura-release.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/{print $1}' | head -1 | xargs)
          if [ -z "$ALIAS" ]; then echo "ERROR: no private key found in the keystore (wrong password?)"; exit 1; fi
          echo "keystore alias: $ALIAS"
          echo "AURA_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      # 🔢 **versionCode עולה בכל בנייה** ✗✓ — גוגל פליי **דוחה** העלאה שנייה עם אותו
      #    versionCode ✗ (ברירת המחדל של Capacitor היא **1** ✗). לכן הוא נגזר ממספר
      #    הריצה של ה-CI ✓ ⇒ **תמיד עולה** ✓, ותמיד גבוה ממה שהופץ קודם ✓✓.
      #    ⚠️ זה נדרש **בנוסף** ל-AAB: בלעדיו ההעלאה השנייה לפליי נכשלת ✗.
      - name: Bump versionCode / versionName
        run: |
          set -e
          GRADLE=android/app/build.gradle
          if [ ! -f "$GRADLE" ]; then echo "ERROR: $GRADLE not found"; exit 1; fi
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          NAME="1.0.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/^(\s*versionCode )[0-9]+/\1${CODE}/" "$GRADLE"
          sed -i -E "s/^(\s*versionName )\"[^\"]*\"/\1\"${NAME}\"/" "$GRADLE"
          echo "--- version now in gradle ---"
          grep -nE "versionCode|versionName|applicationId" "$GRADLE"
          # 🛡️ **וכשל כאן ולא בפליי** ✗✓: אם ה-sed לא תפס (למשל אם טמפלייט של
          #    Capacitor ישתנה בעתיד ✗) — עדיף שהבנייה **תיפול מיד** ✓ מאשר
          #    שנתגלה את זה ב**העלאה השנייה** לפליי, שם זה נכשל בסירוב ✗✗.
          if ! grep -qE "versionCode[[:space:]]+${CODE}[[:space:]]*$" "$GRADLE"; then
            echo "ERROR: versionCode was NOT set to ${CODE} - aborting"; exit 1
          fi
          if ! grep -qE "versionName[[:space:]]+\"${NAME}\"" "$GRADLE"; then
            echo "ERROR: versionName was NOT set to ${NAME} - aborting"; exit 1
          fi
          echo "version OK: code=${CODE} name=${NAME}"

      # 📦 בונים release לא חתום, ומחתימים ידנית עם apksigner.
      #    למה לא signingConfigs בתוך Gradle: תיקיית android/ נבנית מאפס בכל
      #    בנייה, וזו דרך עם פחות הזחות ופחות סיכוי לשבור את build.gradle.
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          echo "--- gradle outputs ---"
          ls -l app/build/outputs/apk/release/
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/aura-release.p12" --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$AURA_ALIAS" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out AURA-release.apk app-release-aligned.apk
          echo "--- signature (this is the proof) ---"
          "$BT/apksigner" verify --print-certs AURA-release.apk
          ls -l AURA-release.apk

          # ── 📦 AAB (Android App Bundle) — **זה מה שגוגל פליי דורשת להפצה** ✗✓ ──
          #    למה זה נוסף: עד כאן ה-CI בנה **APK בלבד** ✗ — וגוגל **לא מקבלת APK
          #    להפצה** ✗✓ (רק ל-AAB). ה-AAB הוא **אותו קוד** ✓, באריזה שגוגל
          #    מפרקת ל-APK מותאם לכל מכשיר ✓✓.
          #    ⚠️ **ואי אפשר לחתום אותו ב-apksigner** ✗✓ — זו חתימת APK ✗; AAB
          #    נחתם ב-**jarsigner** ✓ (מגיע עם ה-JDK שכבר כאן ✓).
          #    ⚠️ ו-Gradle: `bundleRelease` ולא `assembleRelease` ✓.
          ./gradlew bundleRelease --no-daemon
          AAB=app/build/outputs/bundle/release/app-release.aab
          echo "--- bundle output ---"
          ls -l "$AAB"
          jarsigner -keystore "$RUNNER_TEMP/aura-release.p12" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -digestalg SHA-256 -sigalg SHA256withRSA \
            -signedjar AURA-release.aab "$AAB" "$AURA_ALIAS"
          echo "--- AAB signature (the proof) ---"
          jarsigner -verify AURA-release.aab | tail -2
          ls -l AURA-release.aab

      # 📦 **שני הקבצים, ובכוונה** ✓✓: ה-**AAB** הוא מה שנשלח לגוגל פליי ✗✓,
      #    וה-**APK** נשאר למי שמתקין ישירות מהאתר ✓ (הערוץ שקיים ועובד ✓).
      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: AURA-build
          path: |
            android/AURA-release.apk
            android/AURA-release.aab
          retention-days: 30
