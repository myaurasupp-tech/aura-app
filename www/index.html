<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0714">
<title>AURA</title>
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 28px;
    background: #0b0714; color: #fff; text-align: center;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .mark {
    font-size: 32px; font-weight: 900; letter-spacing: 7px;
    background: linear-gradient(135deg, #a855f7, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .em { font-size: 54px; margin: 18px 0 6px }
  h1 { font-size: 18px; margin: 0 0 10px }
  p { color: #9aa0b4; font-size: 14px; line-height: 1.75; max-width: 330px }
  button {
    margin-top: 24px; padding: 14px 30px; border: 0; border-radius: 16px;
    font: inherit; font-weight: 800; cursor: pointer;
    background: linear-gradient(135deg, #a855f7, #22d3ee); color: #07070c;
  }
  button:active { transform: scale(.97) }
</style>
</head>
<body>
  <main>
    <div class="mark">AURA</div>
    <div class="em">&#128225;</div>
    <h1>אין חיבור לאינטרנט</h1>
    <p>AURA מציג את התוכן מהשרת, ולכן צריך חיבור פעם אחת כדי להיכנס. בדוק את הרשת ונסה שוב.</p>
    <button onclick="location.reload()">נסה שוב</button>
  </main>
</body>
</html>
